---
- name: Verify Nextcloud
  hosts: all
  become: true
  gather_facts: false

  vars:
    nextcloud_verify_base_url: "http://localhost:{{ nextcloud_container_http_host_bind_port }}"

    # What Nextcloud calls the database type that this scenario asks the role for.
    nextcloud_verify_expected_dbtype: "{{ {'sqlite': 'sqlite3', 'mysql': 'mysql', 'postgres': 'pgsql'}[nextcloud_database_type] }}"

  tasks:
    # Role defaults are not in scope in a verify play, but the version that
    # Renovate bumps lives in them and is what the running Nextcloud is
    # checked against below. Only leaf literals may be read out of this -
    # anything Jinja-derived would be resolved against an empty namespace.
    - name: Load the Nextcloud role defaults
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
        name: nextcloud_defaults

    - name: Wait for Nextcloud service to become active (up to 180s)
      ansible.builtin.systemd:
        name: nextcloud-server.service
      register: nextcloud_service
      until: nextcloud_service.status.ActiveState == 'active'
      retries: 36
      delay: 5

    - name: Assert Nextcloud service is active
      ansible.builtin.assert:
        that: nextcloud_service.status.ActiveState == 'active'
        fail_msg: "nextcloud-server.service not active ({{ nextcloud_service.status.ActiveState }})"
        success_msg: "nextcloud-server.service is active"

    - name: Retrieve Nextcloud service log for debugging
      when: nextcloud_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl -xeu nextcloud-server.service
      changed_when: false

    # Nextcloud serves pages long before it is usable: an instance which has
    # not completed its installation happily answers with the setup wizard, and
    # one that is mid-upgrade answers with the maintenance page. Both would
    # satisfy a plain "does / respond" check. /status.php is the endpoint that
    # cannot lie about it - it reports whether the installation finished,
    # whether the database schema is current, and which version is running.
    - name: Wait for Nextcloud to report itself as installed (up to 10m)
      ansible.builtin.uri:
        url: "{{ nextcloud_verify_base_url }}/status.php"
        method: GET
        return_content: true
        status_code: [200]
      register: nextcloud_status
      until: >-
        nextcloud_status.status == 200
        and (nextcloud_status.json.installed | default(false) | bool)
        and not (nextcloud_status.json.maintenance | default(true) | bool)
      retries: 120
      delay: 5

    # `versionstring` is the marketing version (34.0.3) that the role pins,
    # while `version` carries a fourth, internal component (34.0.3.2).
    - name: Assert the running Nextcloud is installed, migrated and the version this role installs
      ansible.builtin.assert:
        that:
          - nextcloud_status.json.installed | bool
          - not (nextcloud_status.json.maintenance | bool)
          - not (nextcloud_status.json.needsDbUpgrade | bool)
          - nextcloud_status.json.versionstring == nextcloud_defaults.nextcloud_version | string
          - nextcloud_status.json.version.startswith(nextcloud_defaults.nextcloud_version | string + '.')
        fail_msg: "Nextcloud reports {{ nextcloud_status.json }}, expected an installed {{ nextcloud_defaults.nextcloud_version }}"
        success_msg: "Nextcloud {{ nextcloud_status.json.versionstring }} ({{ nextcloud_status.json.version }}) is installed and its schema is current"

    # The installation only reaches that state by running against the
    # data-stores the scenario wired up, so this is where a scenario which
    # silently fell back to different ones gets caught.
    - name: Read the effective Nextcloud system configuration
      ansible.builtin.command:
        cmd: >-
          docker exec --user={{ nextcloud_uid }}:{{ nextcloud_gid }}
          nextcloud-server
          php /var/www/html/occ config:list system --output=json
      register: nextcloud_config_list
      changed_when: false

    - name: Assert Nextcloud is installed against the database this scenario wired up
      ansible.builtin.assert:
        that: (nextcloud_config_list.stdout | from_json).system.dbtype == nextcloud_verify_expected_dbtype
        fail_msg: "Nextcloud runs on {{ (nextcloud_config_list.stdout | from_json).system.dbtype }}, expected {{ nextcloud_verify_expected_dbtype }}"
        success_msg: "Nextcloud runs on {{ nextcloud_verify_expected_dbtype }}, as the scenario asks for"

    - name: Assert Nextcloud uses the Valkey data-store this scenario wired up
      when: nextcloud_redis_socket_enabled | default(false) | bool
      ansible.builtin.assert:
        that:
          - "'redis' in (nextcloud_config_list.stdout | from_json).system"
          - "'Redis' in (nextcloud_config_list.stdout | from_json).system['memcache.locking']"
          - "'Redis' in (nextcloud_config_list.stdout | from_json).system['memcache.distributed']"
        fail_msg: "Nextcloud is not using the Valkey data-store: {{ (nextcloud_config_list.stdout | from_json).system }}"
        success_msg: "Nextcloud uses the Valkey data-store for distributed caching and locking"

    # An authenticated request goes all the way through to the user table, so
    # it proves that the administrator account the role asked for really was
    # created in that database, rather than the schema merely existing.
    - name: Query the Nextcloud API as the administrator the role created
      ansible.builtin.uri:
        url: "{{ nextcloud_verify_base_url }}/ocs/v2.php/cloud/user?format=json"
        method: GET
        url_username: "{{ nextcloud_environment_variables_nextcloud_admin_user }}"
        url_password: "{{ nextcloud_environment_variables_nextcloud_admin_password }}"
        force_basic_auth: true
        headers:
          OCS-APIRequest: "true"
        return_content: true
        status_code: [200]
      register: nextcloud_ocs_user

    - name: Assert the Nextcloud API authenticates the administrator account
      ansible.builtin.assert:
        that:
          - nextcloud_ocs_user.json.ocs.meta.status == 'ok'
          - nextcloud_ocs_user.json.ocs.data.id == nextcloud_environment_variables_nextcloud_admin_user
        fail_msg: "The Nextcloud API did not report the expected account: {{ nextcloud_ocs_user.json }}"
        success_msg: "The Nextcloud API authenticates {{ nextcloud_environment_variables_nextcloud_admin_user }}"

    - name: Retrieve the Nextcloud web interface
      ansible.builtin.uri:
        url: "{{ nextcloud_verify_base_url }}/"
        method: GET
        follow_redirects: all
        return_content: true
        status_code: [200]
      register: nextcloud_endpoint

    - name: Assert the Nextcloud login page is served
      ansible.builtin.assert:
        that:
          - "'Nextcloud' in nextcloud_endpoint.content"
          - "'/login' in nextcloud_endpoint.url"
        fail_msg: "The Nextcloud web interface did not render its login page ({{ nextcloud_endpoint.url }})"
        success_msg: "The Nextcloud web interface serves its login page"

    - name: Show Nextcloud verification summary
      ansible.builtin.debug:
        msg:
          - "Nextcloud systemd: {{ nextcloud_service.status.ActiveState }}"
          - "Nextcloud version: {{ nextcloud_status.json.versionstring }} ({{ nextcloud_status.json.version }})"
          - "Nextcloud database: {{ (nextcloud_config_list.stdout | from_json).system.dbtype }}"
          - "Nextcloud API account: {{ nextcloud_ocs_user.json.ocs.data.id }}"
          - "Nextcloud web interface: {{ nextcloud_endpoint.status }} at {{ nextcloud_endpoint.url }}"
